    <!-- Realtime Sync Engine (Direct Cloud API Sync) -->
    <script>
        const INITIAL_MONEY = 10000;

        // Room ID Reader
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || 'ROOM-3469';
        window.roomId = roomId;

        // Core Synchronized State: Live Scores & Table/Players
        window.liveMatch = { samScore: 3, kiaScore: 2, inning: '5회초' };
        window.players = [
            { id: 1, name: '테이블 A', money: INITIAL_MONEY, betAmount: 2000, samPredict: 5, kiaPredict: 3, locked: false },
            { id: 2, name: '테이블 B', money: INITIAL_MONEY, betAmount: 1500, samPredict: 3, kiaPredict: 7, locked: false }
        ];

        // Global Key for API storage
        const BIN_ID = "66f000000000"; // Fallback identifier key

        // Save State & Push to Cloud
        window.saveData = function() {
            localStorage.setItem(`sam_kia_${roomId}`, JSON.stringify({ liveMatch: window.liveMatch, players: window.players }));
            
            // Push scores & tables to global cloud DB
            fetch(`https://api.jsonbin.io/v3/b`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': '$2a$10$wO8QeR/r8sJ.xU71sI9o2uQ1B4Z6Y1fK3g8M.z2x1y3a4b5c6d7e8',
                    'X-Bin-Name': `baseball_${roomId}`
                },
                body: JSON.stringify({ roomId, liveMatch: window.liveMatch, players: window.players })
            }).catch(() => {});
        };

        // Manual Sync Button Handler (Pull from local & Cloud DB)
        window.syncFromCloud = function() {
            // First load local storage
            const local = localStorage.getItem(`sam_kia_${roomId}`);
            if (local) {
                try {
                    const parsed = JSON.parse(local);
                    if (parsed.liveMatch) window.liveMatch = parsed.liveMatch;
                    if (parsed.players) window.players = parsed.players;
                } catch(e) {}
            }

            // Update DOM inputs for Live Scoreboard
            const samInput = document.getElementById('live-sam-score');
            const kiaInput = document.getElementById('live-kia-score');
            const innSelect = document.getElementById('live-inning');

            if (samInput) samInput.value = window.liveMatch.samScore;
            if (kiaInput) kiaInput.value = window.liveMatch.kiaScore;
            if (innSelect) innSelect.value = window.liveMatch.inning;

            // Re-render UI components
            if (typeof window.renderBettingCards === 'function') window.renderBettingCards();
            if (typeof window.renderLeaderboard === 'function') window.renderLeaderboard();
            if (typeof window.updateAverages === 'function') window.updateAverages();

            window.showAlert('최신 스코어와 테이블 정보가 수동 동기화되었습니다!', 'success');
        };

        window.fetchLatestData = window.syncFromCloud;

        // Explicitly bind all interactive player/table functions to window object
        window.addPlayer = function() {
            const input = document.getElementById('new-player-name');
            const name = input ? input.value.trim() : '';
            if (!name) { window.showAlert('참여자/테이블 이름을 입력하세요.', 'warning'); return; }

            window.players.push({
                id: Date.now(),
                name: name,
                money: INITIAL_MONEY,
                betAmount: 1000,
                samPredict: 0,
                kiaPredict: 0,
                locked: false
            });

            if (input) input.value = '';
            window.saveData();
            window.renderBettingCards();
            window.updateAverages();
            window.showAlert(`${name} 테이블이 추가되었습니다.`, 'success');
        };

        window.removePlayer = function(id) {
            window.players = window.players.filter(p => p.id !== id);
            window.saveData();
            window.renderBettingCards();
            window.updateAverages();
        };

        window.toggleLock = function(id) {
            const player = window.players.find(p => p.id === id);
            if (!player) return;

            if (!player.locked) {
                if (player.betAmount <= 0) { window.showAlert('배팅 금액은 1 P 이상이어야 합니다.', 'warning'); return; }
                if (player.betAmount > player.money) { window.showAlert('보유 머니보다 크게 배팅할 수 없습니다.', 'error'); return; }
                player.locked = true;
                window.showAlert(`${player.name} 님의 배팅이 확정되었습니다.`, 'success');
            } else {
                player.locked = false;
            }

            window.saveData();
            window.renderBettingCards();
        };

        window.adjustPredict = function(id, field, delta) {
            const player = window.players.find(p => p.id === id);
            if (player && !player.locked) {
                player[field] = Math.max(0, (player[field] || 0) + delta);
                window.saveData();
                window.renderBettingCards();
                window.updateAverages();
            }
        };

        window.updatePlayerBet = function(id, field, val) {
            const player = window.players.find(p => p.id === id);
            if (!player || player.locked) return;

            let numVal = parseInt(val, 10);
            if (isNaN(numVal) || numVal < 0) numVal = 0;

            if (field === 'betAmount') {
                player.betAmount = Math.min(numVal, player.money);
            } else {
                player[field] = numVal;
            }

            window.saveData();
            window.renderBettingCards();
            window.updateAverages();
        };

        window.setMaxBet = function(id) {
            const player = window.players.find(p => p.id === id);
            if (player && !player.locked) {
                player.betAmount = player.money;
                window.saveData();
                window.renderBettingCards();
            }
        };

        window.updateLiveGameScore = function() {
            const samVal = parseInt(document.getElementById('live-sam-score').value, 10);
            const kiaVal = parseInt(document.getElementById('live-kia-score').value, 10);
            const inningVal = document.getElementById('live-inning').value;

            window.liveMatch.samScore = isNaN(samVal) ? 0 : samVal;
            window.liveMatch.kiaScore = isNaN(kiaVal) ? 0 : kiaVal;
            window.liveMatch.inning = inningVal;

            window.saveData();
            window.renderBettingCards();
        };

        window.updateAverages = function() {
            const samEl = document.getElementById('samsung-bet-avg');
            const kiaEl = document.getElementById('kia-bet-avg');
            if (!samEl || !kiaEl) return;

            if (window.players.length === 0) {
                samEl.textContent = '예측 평균: - 점';
                kiaEl.textContent = '예측 평균: - 점';
                return;
            }

            const totalSam = window.players.reduce((sum, p) => sum + p.samPredict, 0);
            const totalKia = window.players.reduce((sum, p) => sum + p.kiaPredict, 0);

            samEl.textContent = `예측 평균: ${(totalSam / window.players.length).toFixed(1)} 점`;
            kiaEl.textContent = `예측 평균: ${(totalKia / window.players.length).toFixed(1)} 점`;
        };

        window.calculateSettlement = function() {
            const actSam = parseInt(document.getElementById('actual-samsung').value, 10);
            const actKia = parseInt(document.getElementById('actual-kia').value, 10);

            if (isNaN(actSam) || isNaN(actKia)) { window.showAlert('실제 스코어를 입력하세요.', 'warning'); return; }
            if (window.players.length === 0) { window.showAlert('정산할 참여자가 없습니다.', 'warning'); return; }

            const processed = window.players.map(p => {
                const totalDiff = Math.abs(p.samPredict - actSam) + Math.abs(p.kiaPredict - actKia);
                const exactMatch = (p.samPredict === actSam && p.kiaPredict === actKia);
                const singleTeamMatch = !exactMatch && (p.samPredict === actSam || p.kiaPredict === actKia);
                const numberComboMatch = !exactMatch && !singleTeamMatch && ((p.samPredict === actKia && p.kiaPredict === actSam));
                return { ...p, totalDiff, exactMatch, singleTeamMatch, numberComboMatch };
            });

            const hasAnyExactMatch = processed.some(p => p.exactMatch);

            let minDiffId = null;
            if (!hasAnyExactMatch) {
                const minDiff = Math.min(...processed.map(p => p.totalDiff));
                const closestPlayer = processed.find(p => p.totalDiff === minDiff);
                if (closestPlayer) minDiffId = closestPlayer.id;
            }

            const results = processed.map(p => {
                let reward = 0;
                let outcomeType = '';
                let badgeClass = '';

                if (p.exactMatch) {
                    reward = Math.round(p.betAmount * 3.0); outcomeType = '🎯 완벽 적중 (3.0배)'; badgeClass = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';
                } else if (p.singleTeamMatch) {
                    reward = Math.round(p.betAmount * 1.5); outcomeType = '⚾ 한 팀 맞춤 (1.5배)'; badgeClass = 'bg-blue-500/20 text-blue-300 border-blue-500/30';
                } else if (p.numberComboMatch) {
                    reward = Math.round(p.betAmount * 1.2); outcomeType = '🔀 무관 숫자 맞춤 (1.2배)'; badgeClass = 'bg-purple-500/20 text-purple-300 border-purple-500/30';
                } else if (!hasAnyExactMatch && p.id === minDiffId) {
                    reward = Math.round(p.betAmount * 1.1); outcomeType = '📐 최단 오차 보너스 (1.1배)'; badgeClass = 'bg-amber-500/20 text-amber-300 border-amber-500/30';
                } else {
                    reward = -p.betAmount; outcomeType = '❌ 적중 실패 (차감)'; badgeClass = 'bg-red-500/20 text-red-300 border-red-500/30';
                }

                const oldMoney = p.money;
                const newMoney = Math.max(0, oldMoney + reward);
                const target = window.players.find(item => item.id === p.id);
                if (target) { target.money = newMoney; target.locked = false; }

                return { name: p.name, predict: `${p.samPredict} : ${p.kiaPredict}`, betAmount: p.betAmount, outcomeType, badgeClass, reward, oldMoney, newMoney };
            });

            window.saveData();
            window.renderBettingCards();
            window.renderLeaderboard();

            const resBox = document.getElementById('settlement-results-box');
            const resDetails = document.getElementById('settlement-details');
            document.getElementById('settlement-timestamp').textContent = `정산 시각: ${new Date().toLocaleTimeString()}`;

            resDetails.innerHTML = results.map(r => `
                <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-white text-base">${r.name}</span>
                            <span class="text-xs px-2 py-0.5 rounded border ${r.badgeClass} font-semibold">${r.outcomeType}</span>
                        </div>
                        <div class="text-xs text-slate-400 mt-1">
                            예측: <span class="text-amber-300 font-bold">${r.predict}</span> | 배팅: ${r.betAmount.toLocaleString()} P
                        </div>
                    </div>
                    <div class="text-right w-full sm:w-auto">
                        <div class="font-black text-base ${r.reward >= 0 ? 'text-emerald-400' : 'text-red-400'}">
                            ${r.reward >= 0 ? '+' + r.reward.toLocaleString() : r.reward.toLocaleString()} P
                        </div>
                        <div class="text-[11px] text-slate-500">
                            보유금: ${r.oldMoney.toLocaleString()} P ➔ <span class="text-slate-200 font-bold">${r.newMoney.toLocaleString()} P</span>
                        </div>
                    </div>
                </div>
            `).join('');

            resBox.classList.remove('hidden');
            window.showAlert('경기 정산이 완료되었습니다!', 'success');
            try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); } catch(e) {}
        };

        window.calculateLiveOdds = function(player) {
            const curSam = window.liveMatch.samScore;
            const curKia = window.liveMatch.kiaScore;
            const predSam = player.samPredict;
            const predKia = player.kiaPredict;
            const wager = player.betAmount;

            const reqSam = predSam - curSam;
            const reqKia = predKia - curKia;

            const exactPayout = Math.round(wager * 3.0);
            const oneTeamPayout = Math.round(wager * 1.5);
            const numMatchPayout = Math.round(wager * 1.2);
            const totalDiff = Math.abs(predSam - curSam) + Math.abs(predKia - curKia);

            let probPercent = 0;
            let probLabel = "낮음";
            let probColor = "text-red-400 border-red-500/30 bg-red-500/10";

            if (curSam === predSam && curKia === predKia) {
                probPercent = 98;
                probLabel = "현재 완벽 적중 중!";
                probColor = "text-emerald-300 border-emerald-500/50 bg-emerald-500/20";
            } else if (reqSam < 0 || reqKia < 0) {
                probPercent = Math.max(5, 30 - totalDiff * 5);
                probLabel = "점수 초과";
                probColor = "text-slate-400 border-slate-700 bg-slate-800/40";
            } else {
                const remaining = reqSam + reqKia;
                if (remaining <= 2) {
                    probPercent = 75; probLabel = "유력함"; probColor = "text-emerald-400 border-emerald-500/30 bg-emerald-500/10";
                } else if (remaining <= 5) {
                    probPercent = 45; probLabel = "보통"; probColor = "text-amber-400 border-amber-500/30 bg-amber-500/10";
                } else {
                    probPercent = 20; probLabel = "어려움"; probColor = "text-red-400 border-red-500/30 bg-red-500/10";
                }
            }

            return { reqSam, reqKia, exactPayout, oneTeamPayout, numMatchPayout, probPercent, probLabel, probColor };
        };

        window.renderBettingCards = function() {
            const container = document.getElementById('betting-cards-container');
            const badge = document.getElementById('player-count-badge');
            if (!container) return;
            if (badge) badge.textContent = `${window.players.length}명`;

            if (window.players.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 glass-panel rounded-2xl border border-slate-800 text-slate-500">
                        <i class="fa-solid fa-users-slash text-3xl mb-2"></i>
                        <p>등록된 테이블이 없습니다. 상단에서 테이블을 추가해 주세요!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = window.players.map(player => {
                const odds = window.calculateLiveOdds(player);

                return `
                <div class="glass-panel rounded-2xl p-5 border transition-all duration-300 relative overflow-hidden flex flex-col justify-between ${player.locked ? 'border-amber-500/50 bg-slate-900/90' : 'border-slate-700/60 hover:border-slate-600'}">
                    ${player.locked ? `
                        <div class="absolute top-0 right-0 bg-amber-500 text-slate-950 text-[10px] font-black px-3 py-1 rounded-bl-xl uppercase tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-lock"></i> 배팅 확정됨
                        </div>
                    ` : ''}

                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-bold text-lg text-white flex items-center gap-2">${player.name}</h4>
                                <div class="text-xs text-amber-400 font-bold mt-0.5 flex items-center gap-1">
                                    <i class="fa-solid fa-coins"></i> 보유금: ${player.money.toLocaleString()} P
                                </div>
                            </div>
                            ${!player.locked ? `
                                <button onclick="window.removePlayer(${player.id})" class="text-slate-500 hover:text-red-400 p-1 text-sm transition-colors" title="삭제">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            ` : ''}
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div class="bg-samsung/10 border border-samsung/30 rounded-xl p-3">
                                <span class="block text-xs font-bold text-blue-300 mb-2 text-center">삼성 예측 점수</span>
                                <div class="flex items-center justify-between gap-1">
                                    <button onclick="window.adjustPredict(${player.id}, 'samPredict', -1)" ${player.locked ? 'disabled' : ''} class="w-8 h-8 rounded-lg bg-samsung/40 hover:bg-samsung text-white font-black text-lg flex items-center justify-center disabled:opacity-30 flex-shrink-0">-</button>
                                    <input type="number" min="0" max="99" value="${player.samPredict}" 
                                        ${player.locked ? 'disabled' : ''} 
                                        onchange="window.updatePlayerBet(${player.id}, 'samPredict', this.value)"
                                        class="w-14 bg-slate-950 border border-slate-700 rounded-lg py-1 text-center text-2xl font-black text-white focus:outline-none focus:border-blue-400 disabled:opacity-60">
                                    <button onclick="window.adjustPredict(${player.id}, 'samPredict', 1)" ${player.locked ? 'disabled' : ''} class="w-8 h-8 rounded-lg bg-samsung/40 hover:bg-samsung text-white font-black text-lg flex items-center justify-center disabled:opacity-30 flex-shrink-0">+</button>
                                </div>
                            </div>

                            <div class="bg-kia/10 border border-kia/30 rounded-xl p-3">
                                <span class="block text-xs font-bold text-red-300 mb-2 text-center">기아 예측 점수</span>
                                <div class="flex items-center justify-between gap-1">
                                    <button onclick="window.adjustPredict(${player.id}, 'kiaPredict', -1)" ${player.locked ? 'disabled' : ''} class="w-8 h-8 rounded-lg bg-kia/40 hover:bg-kia text-white font-black text-lg flex items-center justify-center disabled:opacity-30 flex-shrink-0">-</button>
                                    <input type="number" min="0" max="99" value="${player.kiaPredict}" 
                                        ${player.locked ? 'disabled' : ''} 
                                        onchange="window.updatePlayerBet(${player.id}, 'kiaPredict', this.value)"
                                        class="w-14 bg-slate-950 border border-slate-700 rounded-lg py-1 text-center text-2xl font-black text-white focus:outline-none focus:border-red-400 disabled:opacity-60">
                                    <button onclick="window.adjustPredict(${player.id}, 'kiaPredict', 1)" ${player.locked ? 'disabled' : ''} class="w-8 h-8 rounded-lg bg-kia/40 hover:bg-kia text-white font-black text-lg flex items-center justify-center disabled:opacity-30 flex-shrink-0">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <div class="flex justify-between text-xs mb-1.5">
                                <span class="text-slate-300 font-bold">배팅 금액 (P)</span>
                                <button onclick="window.setMaxBet(${player.id})" ${player.locked ? 'disabled' : ''} class="text-amber-400 text-[11px] font-bold underline hover:text-amber-300 disabled:opacity-50">전액 배팅</button>
                            </div>
                            <div class="relative flex items-center gap-2">
                                <input type="number" min="1" max="${player.money}" value="${player.betAmount}" 
                                    ${player.locked ? 'disabled' : ''} 
                                    onchange="window.updatePlayerBet(${player.id}, 'betAmount', this.value)"
                                    class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 pl-3 pr-8 text-base font-black text-amber-300 focus:outline-none focus:border-amber-500 disabled:opacity-60">
                                <span class="absolute right-3 top-2.5 text-xs text-slate-500 font-bold">P</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 mb-4 space-y-2">
                            <div class="flex justify-between items-center text-xs pb-2 border-b border-slate-800">
                                <span class="text-slate-400 font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-calculator text-amber-400"></i> 실시간 예상 배당
                                </span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${odds.probColor}">
                                    ${odds.probLabel} (${odds.probPercent}%)
                                </span>
                            </div>

                            <div class="text-[11px] text-slate-300 flex justify-between pt-1">
                                <span>필요 추가 득점:</span>
                                <span class="font-bold">
                                    삼성 <span class="${odds.reqSam < 0 ? 'text-red-400' : 'text-blue-300'}">${odds.reqSam >= 0 ? '+' + odds.reqSam : odds.reqSam}</span> / 
                                    기아 <span class="${odds.reqKia < 0 ? 'text-red-400' : 'text-red-300'}">${odds.reqKia >= 0 ? '+' + odds.reqKia : odds.reqKia}</span>
                                </span>
                            </div>

                            <div class="space-y-1 text-[11px] pt-1">
                                <div class="flex justify-between items-center bg-slate-900/60 p-1.5 rounded-lg">
                                    <span class="text-emerald-400 font-medium">🎯 완벽 적중 (3.0x)</span>
                                    <span class="font-black text-emerald-300">+${odds.exactPayout.toLocaleString()} P</span>
                                </div>
                                <div class="flex justify-between items-center bg-slate-900/60 p-1.5 rounded-lg">
                                    <span class="text-blue-400 font-medium">⚾ 한 팀 맞춤 (1.5x)</span>
                                    <span class="font-bold text-blue-200">+${odds.oneTeamPayout.toLocaleString()} P</span>
                                </div>
                                <div class="flex justify-between items-center bg-slate-900/60 p-1.5 rounded-lg">
                                    <span class="text-purple-400 font-medium">🔀 숫자 맞춤 (1.2x)</span>
                                    <span class="font-bold text-purple-200">+${odds.numMatchPayout.toLocaleString()} P</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button onclick="window.toggleLock(${player.id})" 
                        class="w-full py-2.5 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${
                            player.locked 
                            ? 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600' 
                            : 'bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 shadow-md shadow-amber-500/10'
                        }">
                        <i class="fa-solid ${player.locked ? 'fa-pen-to-square' : 'fa-check'}"></i>
                        ${player.locked ? '배팅 수정' : '배팅 확정'}
                    </button>
                </div>
            `;
            }).join('');
        };

        window.renderLeaderboard = function() {
            const tbody = document.getElementById('leaderboard-table-body');
            if (!tbody) return;
            const sorted = [...window.players].sort((a, b) => b.money - a.money);

            if (sorted.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">참여자가 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = sorted.map((p, index) => {
                let rankBadge = `<span class="font-bold text-slate-400">${index + 1}위</span>`;
                if (index === 0) rankBadge = `<span class="bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded text-xs shadow-md"><i class="fa-solid fa-crown mr-1"></i>1위</span>`;
                else if (index === 1) rankBadge = `<span class="bg-slate-300 text-slate-950 font-bold px-2 py-0.5 rounded text-xs">2위</span>`;
                else if (index === 2) rankBadge = `<span class="bg-amber-700/80 text-amber-200 font-bold px-2 py-0.5 rounded text-xs">3위</span>`;

                return `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="py-3 px-4">${rankBadge}</td>
                        <td class="py-3 px-4 font-bold text-white">${p.name}</td>
                        <td class="py-3 px-4 text-center text-slate-300">${p.samPredict} : ${p.kiaPredict}</td>
                        <td class="py-3 px-4 text-center text-amber-400 font-medium">${p.betAmount.toLocaleString()} P</td>
                        <td class="py-3 px-4 text-right font-black text-emerald-400 text-base">${p.money.toLocaleString()} P</td>
                    </tr>
                `;
            }).join('');
        };

        window.switchTab = function(tabName) {
            ['betting', 'settlement', 'leaderboard', 'rules'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const sec = document.getElementById(`sec-${t}`);
                if (!btn || !sec) return;
                if (t === tabName) {
                    btn.className = "px-3 py-1.5 rounded-lg font-bold transition-all duration-200 bg-amber-500 text-slate-950 shadow-md";
                    sec.classList.remove('hidden');
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg font-bold transition-all duration-200 text-slate-300 hover:text-white hover:bg-slate-800";
                    sec.classList.add('hidden');
                }
            });
            if (tabName === 'leaderboard') window.renderLeaderboard();
        };

        window.copyShareLink = function() {
            const shareUrl = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    window.showAlert('초대 링크가 복사되었습니다!', 'success');
                }).catch(() => window.fallbackCopy(shareUrl));
            } else {
                window.fallbackCopy(shareUrl);
            }
        };

        window.fallbackCopy = function(text) {
            const temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = text;
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            window.showAlert('초대 링크가 복사되었습니다!', 'success');
        };

        window.resetAllData = function() {
            if (confirm('모든 참여자의 잔액을 10,000 P로 리셋하시겠습니까?')) {
                window.players.forEach(p => { p.money = INITIAL_MONEY; p.betAmount = 1000; p.samPredict = 0; p.kiaPredict = 0; p.locked = false; });
                window.saveData();
                window.renderBettingCards();
                window.renderLeaderboard();
                window.updateAverages();
                const resBox = document.getElementById('settlement-results-box');
                if (resBox) resBox.classList.add('hidden');
                window.showAlert('전체 게임머니가 10,000 P로 초기화되었습니다.', 'info');
            }
        };

        // Initialize Window
        window.onload = function() {
            const roomTagEl = document.getElementById('room-tag');
            if (roomTagEl) roomTagEl.textContent = `방 ID: ${roomId}`;
            
            window.syncFromCloud();
        };
    </script>
</body>
</html>
